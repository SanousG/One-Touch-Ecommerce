# Solo entornos locales de desarrollo y pruebas.
# Los nombres de contenedores y volúmenes son exclusivos de este proyecto.
services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: one-touch-ecommerce-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: one_touch_dev
    ports:
      - "5432:5432"
    volumes:
      - one-touch-ecommerce-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d one_touch_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: one-touch-ecommerce-postgres-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: one_touch_test
    ports:
      - "5433:5432"
    volumes:
      - one-touch-ecommerce-pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d one_touch_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  one-touch-ecommerce-pgdata-dev:
  one-touch-ecommerce-pgdata-test:
